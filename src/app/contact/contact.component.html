<section class="contact" id="contact">
  <div class="glow" aria-hidden="true"></div>
  <div class="container inner">
    <span class="eyebrow reveal">Contact</span>
    <h2 class="display big mask">
      <span class="line"><span class="line-inner">Building</span></span>
      <span class="line"><span class="line-inner" style="--d: .1s">something?</span></span>
      <span class="line"><span class="line-inner gold-text" style="--d: .2s">Let's talk.</span></span>
    </h2>
    <p class="note reveal">
      Need a technical co-pilot for your MVP, architecture or team? Drop me a message — I reply fast.
    </p>
    <div class="actions reveal">
      <a class="btn btn-primary" data-magnetic [href]="profile.linkedin" target="_blank" rel="noopener">
        Message me on LinkedIn <span class="arrow">→</span>
      </a>
      <a class="btn" data-magnetic [href]="profile.github" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <footer class="container footer">
    <span>© {{ year }} {{ profile.name }}</span>
    <span>Let's innovate and create ✨</span>
    <a href="#top">Back to top ↑</a>
  </footer>
</section>
