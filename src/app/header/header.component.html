<header class="nav" [class.scrolled]="scrolled()" [class.open]="menuOpen()">
  <div class="nav-inner">
    <a href="#top" class="brand" (click)="close()" aria-label="Sulav Bhandari — home">
      <img src="logo.png" alt="Sulav Bhandari — software engineer" width="1167" height="412">
    </a>

    <nav class="links" aria-label="Primary">
      <span
        class="pill"
        aria-hidden="true"
        [class.on]="pill()"
        [style.translate]="(pill()?.x ?? 0) + 'px 0'"
        [style.width.px]="pill()?.w ?? 0"
      ></span>
      @for (link of links; track link.href) {
        <a
          [href]="link.href"
          [class.active]="active() === link.href"
          [attr.aria-current]="active() === link.href ? 'location' : null"
          (click)="close()"
        >{{ link.label }}</a>
      }
      <a href="#contact" class="btn btn-primary cta" (click)="close()">Let's talk <span class="arrow">→</span></a>
    </nav>

    <button class="burger" type="button" (click)="toggle()" [attr.aria-expanded]="menuOpen()" aria-label="Toggle menu">
      <span></span><span></span>
    </button>
  </div>
</header>
